mcp_servers:
  plane:
    command: /home/core/.hermes/bin/uvx
    args:
    - plane-mcp-server
    - stdio
    env:
      PLANE_API_KEY: ${PLANE_API_KEY}
      PLANE_BASE_URL: http://127.0.0.1:18111
      PLANE_WORKSPACE_SLUG: personal
      LOG_PAYLOADS: 'false'
    tools:
      include:
      - project
      - workitem
      - workitem_comment
      - workitem_link
      - workitem_relation
      - workitem_activity
      - workitem_attachment
      - state
      - label
      - member
      - cycle
      - module
      - project_estimate
  n8n:
    url: http://127.0.0.1:15678/mcp-server/http
    headers:
      Authorization: Bearer ${N8N_MCP_TOKEN}
  github:
    command: /usr/local/bin/edge-github-mcp
    args: []
  playwright:
    command: /usr/bin/npx
    args:
    - --yes
    - '@playwright/mcp@latest'
    - --headless
    - --isolated
    - --executable-path
    - /home/core/.cache/ms-playwright/chromium-1243/chrome-linux64/chrome
    - --no-sandbox
