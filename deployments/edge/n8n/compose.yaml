name: n8n

services:
  n8n:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:15678:5678"

    environment:
      TZ: Europe/Moscow
      GENERIC_TIMEZONE: Europe/Moscow

      N8N_HOST: n8n.escloud.us
      N8N_PORT: "5678"
      N8N_PROTOCOL: https

      WEBHOOK_URL: https://n8n.escloud.us/
      N8N_EDITOR_BASE_URL: https://n8n.escloud.us/
      N8N_PROXY_HOPS: "1"

      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"

    volumes:
      - /srv/n8n:/home/node/.n8n
      - /srv/knowledge/obsidian:/srv/knowledge/obsidian:rw

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz/readiness')
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      default:
      edge_internal:
        aliases:
          - n8n
          - n8n.edge.internal

networks:
  default:
    name: n8n_hermes
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: n8n-hermes
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
  edge_internal:
    external: true
