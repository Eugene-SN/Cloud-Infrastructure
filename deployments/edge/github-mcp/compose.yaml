name: github-mcp
services:
  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: github-mcp
    command:
      - http
      - --listen-host=0.0.0.0
      - --port=8082
      - --toolsets=repos,issues,pull_requests,actions
      - --tools=get_me
    env_file:
      - .env
    ports:
      - "127.0.0.1:18082:8082"
    networks:
      edge_internal:
        aliases:
          - github-mcp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge_internal:
    external: true
