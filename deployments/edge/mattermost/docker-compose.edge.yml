services:
  postgres:
    profiles:
      - disabled

  mattermost:
    container_name: mattermost
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on: !reset []
    ports:
      - "127.0.0.1:${APP_PORT:-18065}:8065"
    networks:
      default:
      postgres_net:
      edge_internal:
        aliases:
          - mattermost

networks:
  default:
  postgres_net:
    external: true
  edge_internal:
    external: true
