services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: nextcloud:35.0-apache
    restart: unless-stopped
    ports:
    - 127.0.0.1:18080:80
    volumes:
    - /srv/nextcloud/data:/var/www/html
    - /srv/cloud:/var/www/html/data/f74f359708f72bd3011f605925e1a176a495a48c67f1ee7ddaec6a602ea14425/files
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB_FILE: /run/secrets/postgres_db
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      NEXTCLOUD_ADMIN_USER_FILE: /run/secrets/nextcloud_admin_user
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.escloud.us
      OVERWRITEHOST: cloud.escloud.us
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.escloud.us
      REDIS_HOST: redis
      NEXTCLOUD_INIT_HTACCESS: 'true'
    secrets:
    - postgres_db
    - postgres_user
    - postgres_password
    - nextcloud_admin_user
    - nextcloud_admin_password
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default: null
      postgres_net: null
      edge_internal:
        aliases:
        - nextcloud.edge.internal
  cron:
    image: nextcloud:35.0-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
    - /srv/nextcloud/data:/var/www/html
    - /srv/cloud:/var/www/html/data/f74f359708f72bd3011f605925e1a176a495a48c67f1ee7ddaec6a602ea14425/files
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - default
    - postgres_net
    - edge_internal
networks:
  default: null
  postgres_net:
    external: true
  edge_internal:
    external: true
secrets:
  postgres_db:
    file: /opt/nextcloud/secrets/postgres_db
  postgres_user:
    file: /opt/nextcloud/secrets/postgres_user
  postgres_password:
    file: /opt/nextcloud/secrets/postgres_password
  nextcloud_admin_user:
    file: /opt/nextcloud/secrets/nextcloud_admin_user
  nextcloud_admin_password:
    file: /opt/nextcloud/secrets/nextcloud_admin_password
