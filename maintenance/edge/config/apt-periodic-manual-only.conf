// Edge Stage 7: real package updates are operator-initiated from
// update.escloud.us only. This late-sorting local override keeps the
// package-owned 10periodic/20auto-upgrades files intact while disabling every
// APT periodic action. The associated systemd units are masked at runtime.
APT::Periodic::Enable "0";
APT::Periodic::Update-Package-Lists "0";
APT::Periodic::Download-Upgradeable-Packages "0";
APT::Periodic::AutocleanInterval "0";
APT::Periodic::Unattended-Upgrade "0";
