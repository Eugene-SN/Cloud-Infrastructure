---
- name: Manual Edge update unit
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refresh maintenance cache before individual update
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /opt/edge-maintenance/scripts/maintenance-refresh
          - --target
          - "{{ edge_update_target }}"
      changed_when: false

    - name: Validate fixed target and local prerequisites
      ansible.builtin.command:
        argv: [sudo, -n, /opt/edge-maintenance/scripts/manual-update, "{{ edge_update_target }}", --preflight]
      changed_when: false

    - name: Execute accepted manual driver
      ansible.builtin.command:
        argv: [sudo, -n, /opt/edge-maintenance/scripts/manual-update, "{{ edge_update_target }}"]
      register: update_result
      changed_when: true

    - name: Show Semaphore self-update handoff
      ansible.builtin.debug:
        var: update_result.stdout_lines
      when: edge_update_target == 'SEMAPHORE'

    - name: Refresh status after the driver
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /opt/edge-maintenance/scripts/maintenance-refresh
          - --target
          - "{{ edge_update_target }}"
      changed_when: false
      when: update_result is succeeded
