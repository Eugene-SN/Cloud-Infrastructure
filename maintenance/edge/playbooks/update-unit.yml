---
- name: Manual Edge update unit
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refresh maintenance cache before individual update
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /opt/edge-maintenance/scripts/maintenance-refresh
          - --target
          - "{{ edge_update_target }}"
      changed_when: false

    - name: Validate fixed target and local prerequisites
      ansible.builtin.command:
        argv: [sudo, -n, /opt/edge-maintenance/scripts/manual-update, "{{ edge_update_target }}", --preflight]
      changed_when: false

    - name: Execute accepted manual driver
      ansible.builtin.command:
        argv: [sudo, -n, /opt/edge-maintenance/scripts/manual-update, "{{ edge_update_target }}"]
      register: update_result
      changed_when: true
      failed_when: false

    - name: Show component driver result and diagnostics
      ansible.builtin.debug:
        msg:
          - "DRIVER_RC={{ update_result.rc }}"
          - "{{ update_result.stdout | default('') }}"
          - "{{ update_result.stderr | default('') }}"

    - name: Refresh status after the driver
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /opt/edge-maintenance/scripts/maintenance-refresh
          - --target
          - "{{ edge_update_target }}"
      changed_when: false
      register: post_refresh
      failed_when: false

    - name: Report a failed update or status refresh
      ansible.builtin.fail:
        msg: >-
          {{ edge_update_target }} update did not complete successfully.
          Driver RC={{ update_result.rc }}; refresh RC={{ post_refresh.rc }}.
          {{ update_result.stderr | default('') }}
          {{ post_refresh.stderr | default('') }}
      when: update_result.rc != 0 or post_refresh.rc != 0
