---
- name: Manual Edge update unit
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate fixed target and local prerequisites
      ansible.builtin.command:
        argv: [sudo, -n, /opt/edge-maintenance/scripts/manual-update, "{{ edge_update_target }}", --preflight]
      changed_when: false
    - name: Execute accepted manual driver
      ansible.builtin.command:
        argv: [sudo, -n, /opt/edge-maintenance/scripts/manual-update, "{{ edge_update_target }}"]
      register: update_result
      changed_when: true
    - name: Refresh status after the driver
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /opt/edge-maintenance/scripts/maintenance-refresh
      changed_when: false
      when: update_result is succeeded
