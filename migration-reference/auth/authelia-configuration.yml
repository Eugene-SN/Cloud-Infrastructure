theme: auto

server:
  address: tcp://0.0.0.0:9091

log:
  level: info
  format: text

totp:
  issuer: escloud.us

identity_validation:
  reset_password:
    jwt_secret: {{ secret "/secrets/jwt_secret" }}

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2

password_policy:
  standard:
    enabled: true
    min_length: 12
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: false

access_control:
  default_policy: deny
  rules:
    - domain: escloud.us
      resources:
        - "^/api/.*$"
      policy: bypass

    - domain_regex: "^go\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"

    - domain_regex: "^app\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"

    - domain_regex: "^docs\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"

    - domain_regex: "^cloud\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"

    - domain_regex: "^sync\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"


    - domain_regex: "^code\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"

    - domain_regex: "^chat\\.escloud\\.us$"
      policy: one_factor
      subject:
        - "group:admins"
        - "group:aiw"

session:
  secret: {{ secret "/secrets/session_secret" }}
  inactivity: 1h
  expiration: 12h
  remember_me: 1M
  cookies:
    - name: authelia_session
      domain: escloud.us
      authelia_url: https://auth.escloud.us/
      default_redirection_url: https://escloud.us/

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 15m

storage:
  encryption_key: {{ secret "/secrets/storage_encryption_key" }}
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
