# AI Workspace managed host: CloudCLI
server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:8080 proxy_protocol;

    server_name code.escloud.us;

    access_log /var/log/nginx/code.access.log;
    error_log  /var/log/nginx/code.error.log warn;

    client_max_body_size 100m;

    location /internal/authelia/authz {
        internal;

        proxy_pass http://127.0.0.1:19091/api/authz/auth-request;
        proxy_http_version 1.1;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # CloudCLI has its own Authorization Bearer/JWT.
        # Do not leak that header into Authelia.
        proxy_set_header Authorization "";

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL https://$host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @authelia_signin_code {
        return 302 https://auth.escloud.us/?rd=https://code.escloud.us$request_uri;
    }

    # AI Workspace managed PWA manifest: AI Coding CLI
    location = /manifest.json {
        auth_request /internal/authelia/authz;
        error_page 401 403 = @authelia_signin_code;

        alias /var/www/ai-coding-cli/manifest.json;
        default_type application/manifest+json;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        auth_request /internal/authelia/authz;
        error_page 401 403 = @authelia_signin_code;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name   $upstream_http_remote_name;
        auth_request_set $email  $upstream_http_remote_email;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Remote-Email  $email;

        proxy_pass http://127.0.0.1:18140/;
        proxy_http_version 1.1;
        proxy_buffering off;

        # Keep HTML uncompressed so nginx can apply persistent
        # branding without modifying the CloudCLI npm package.
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter '<title>CloudCLI UI</title>' '<title>AI Coding CLI</title>';
        sub_filter '<meta name="apple-mobile-web-app-title" content="Claude UI" />' '<meta name="apple-mobile-web-app-title" content="AI Coding CLI" />';

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }
}


