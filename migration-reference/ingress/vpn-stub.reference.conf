# AI Workspace final domain model.
# Managed as part of Routing 21.2A.
#
# Target:
#   escloud.us        -> public masking page
#   app.escloud.us    -> Homepage / AI Workspace dashboard
#   auth.escloud.us   -> Authelia
#   go.escloud.us     -> n8n
#   docs.escloud.us   -> protected docs placeholder
#   cloud.escloud.us  -> protected cloud placeholder

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 127.0.0.1:8080 proxy_protocol default_server;

    server_name escloud.us 45.92.156.17 _;

    root /var/www/escloud.us/public;
    index index.html;

    access_log /var/log/nginx/escloud.access.log;
    error_log  /var/log/nginx/escloud.error.log warn;

location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }


    # System managed ACME challenge route
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }
}







server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:8080 proxy_protocol;

    server_name auth.escloud.us;

    access_log /var/log/nginx/auth.access.log;
    error_log  /var/log/nginx/auth.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:19091/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL https://$host$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # System managed ACME challenge route
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:8080 proxy_protocol;

    server_name app.escloud.us;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    client_max_body_size 100m;

    location /internal/authelia/authz {
        internal;

        proxy_pass http://127.0.0.1:19091/api/authz/auth-request;
        proxy_http_version 1.1;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL https://$host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /internal/authelia/authz-terminal {
        internal;

        proxy_pass http://127.0.0.1:19091/api/authz/auth-request;
        proxy_http_version 1.1;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL https://$host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @authelia_signin_app {
        return 302 https://auth.escloud.us/?rd=https://app.escloud.us$request_uri;
    }

    location = /terminal {
        return 302 /terminal/;
    }

    location /terminal/ {
        auth_request /internal/authelia/authz-terminal;
        error_page 401 403 = @authelia_signin_app;

        proxy_pass https://127.0.0.1:9090/terminal/;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_verify off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        gzip off;

        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /maintenance {
        return 302 /maintenance/;
    }

    location = /maintenance/reboot-health {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:19091/api/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        proxy_buffering off;

        proxy_set_header Host 127.0.0.1:19091;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /maintenance/ {
        auth_request /internal/authelia/authz;
        error_page 401 403 = @authelia_signin_app;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name   $upstream_http_remote_name;
        auth_request_set $email  $upstream_http_remote_email;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Remote-Email  $email;

        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_read_timeout 780s;
        proxy_send_timeout 780s;
        proxy_buffering off;
        client_max_body_size 8k;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /maintenance;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /maintenance/monitoring/ {
        auth_request /internal/authelia/authz;
        error_page 401 403 = @authelia_signin_app;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name   $upstream_http_remote_name;
        auth_request_set $email  $upstream_http_remote_email;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Remote-Email  $email;

        proxy_pass http://127.0.0.1:18081/monitoring/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /internal/authelia/authz;
        error_page 401 403 = @authelia_signin_app;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name   $upstream_http_remote_name;
        auth_request_set $email  $upstream_http_remote_email;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Remote-Email  $email;

        proxy_pass http://127.0.0.1:13000/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /speedtest/ {
        proxy_pass http://127.0.0.1:18082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # System managed ACME challenge route
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }
}

