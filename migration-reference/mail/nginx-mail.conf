# AI Workspace — Mail WebUI, Stalwart Admin/Account/JMAP.
# Public TLS is terminated by the VPN edge and forwarded to nginx on 127.0.0.1:8080.

server {
    listen 80;
    listen [::]:80;

    server_name mail.escloud.us;

    include /etc/nginx/snippets/letsencrypt-webroot.conf;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8080 proxy_protocol;

    server_name mail.escloud.us;

    access_log /var/log/nginx/mail.access.log;
    error_log  /var/log/nginx/mail.error.log warn;

    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # System Stalwart admin/account API discovery routes.
    # Keep /api/health and Bulwark /api/* on the webmail backend; only these
    # Stalwart UI/API endpoints are routed to Stalwart.
    location ^~ /api/discover/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Route-Name mail-stalwart-api-discover always;
    }

    # System Stalwart admin schema payload route.
    # /api/schema returns/redirects to /api/schema/<schema-id>; both must stay on Stalwart.
    location ^~ /api/schema/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-api-schema-payload always;
    }

    location = /api/schema {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Route-Name mail-stalwart-api-schema always;
    }

    location = /api/account {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Route-Name mail-stalwart-api-account always;
    }

    # System Stalwart password authentication endpoint.
    # Stalwart login form posts credentials to exact /api/auth.
    # Keep Bulwark routes such as /api/auth/session and /api/auth/stalwart-context
    # on the default Bulwark backend by using exact-match only.
    location = /api/auth {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-api-auth always;
    }

    # System Stalwart OAuth login route.
    # Stalwart discovery returns authorization_endpoint=/login.
    # Bulwark webmail remains available at / and /en/login.
    location = /login {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-login always;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Route-Name mail-stalwart-auth always;
    }

    location = /.well-known/jmap {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-jmap-well-known always;
    }

    location ^~ /jmap {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-jmap always;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-admin always;
    }

    location ^~ /account/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        add_header X-Route-Name mail-stalwart-account always;
    }

    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Uri $request_uri;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        add_header X-Route-Name mail-bulwark-webmail always;
    }
}
